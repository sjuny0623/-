<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><style>.c{animation:blink 1.1s steps(1) 2,stay .01s 2.2s forwards}.u{transform-origin:35px 62px;transform:scale(0);animation:grow .55s cubic-bezier(.2,.9,.25,1.15) 2.2s forwards}.l{opacity:0;transform:translate(-8px,-8px);animation:in .4s ease-out 2.5s forwards}@keyframes blink{50%{opacity:0}}@keyframes stay{to{opacity:1}}@keyframes grow{to{transform:scale(1)}}@keyframes in{to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.c,.u,.l{animation:none;opacity:1;transform:none}}</style><rect width="100" height="100" rx="22" fill="#2340E0"/><rect class="c" x="24" y="22" width="11" height="56" rx="2" fill="#FFFFFF"/><path class="u" d="M40 53.5 L67 22 H81 L40 69.5 Z" fill="#A9BBFF"/><path class="l" d="M50.5 54.6 L58.6 45.4 L81 78 H67.4 Z" fill="#FFFFFF"/></svg>