<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>페이지를 찾을 수 없습니다 | 키워드마스터</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:48px 24px;background:#0A1024;color:#fff;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",sans-serif;word-break:keep-all}
    main{width:100%;max-width:720px;margin:0 auto}
    .logo{display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800}
    .logo img{width:28px;height:28px;border-radius:6px}.logo b{color:#A9BBFF}
    .n{margin-top:56px;font-size:14px;font-weight:700;letter-spacing:.12em;color:#A9BBFF}
    h1{margin-top:12px;font-size:clamp(32px,6vw,56px);font-weight:800;line-height:1.2;letter-spacing:-.045em}
    h1 i{display:inline-block;width:.06em;height:.9em;margin-left:.06em;vertical-align:-.08em;background:#A9BBFF;font-style:normal;animation:b 1.1s steps(1) infinite}
    @keyframes b{50%{opacity:0}}@media (prefers-reduced-motion:reduce){h1 i{animation:none}}
    p{margin-top:16px;font-size:17px;line-height:1.7;color:rgba(255,255,255,.7)}
    .go{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
    .go a{display:inline-flex;align-items:center;min-height:52px;padding:0 22px;border-radius:4px;font-weight:700;text-decoration:none}
    .p{background:#2340E0;color:#fff}.s{border:1px solid rgba(255,255,255,.34);color:#fff}
  </style>
</head>
<body>
  <main>
    <a class="logo" href="/" aria-label="키워드마스터 홈"><img src="/favicon.svg" width="28" height="28" alt="" /><span>KEYWORD<b>MASTER</b></span></a>
    <p class="n">404</p>
    <h1>찾으시는 페이지가 없습니다.<i aria-hidden="true"></i></h1>
    <p>주소가 바뀌었거나 삭제된 페이지입니다. 홈에서 필요한 정보를 찾아보세요.</p>
    <div class="go"><a class="p" href="/">홈으로 가기</a><a class="s" href="/#contact">무료 상담 신청</a></div>
  </main>
</body>
</html>
